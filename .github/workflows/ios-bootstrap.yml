name: Bootstrap Kira iOS

on:
  push:
    branches:
      - ios-capacitor

permissions:
  contents: write

jobs:
  bootstrap-ios:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web bundle for native shell
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

      - name: Generate or sync iOS project
        run: |
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify iOS simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit generated iOS project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json ios
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Bootstrap native iOS project [skip ci]"
            git push
          fi
