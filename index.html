<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Finance</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <!-- ===================================
         AUTH
    ==================================== -->

    <section
        id="auth-section"
        class="auth-section"
    >

        <div class="auth-card">

            <h1>My Finance</h1>

            <p class="auth-subtitle">
                Sign in to manage your finances.
            </p>

            <form id="auth-form">

                <label for="auth-email">
                    Email
                </label>

                <input
                    type="email"
                    id="auth-email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >


                <label for="auth-password">
                    Password
                </label>

                <input
                    type="password"
                    id="auth-password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    id="login-button"
                >
                    Login
                </button>


                <button
                    type="button"
                    id="register-button"
                >
                    Create Account
                </button>

            </form>


            <p
                id="auth-message"
                class="auth-message"
            ></p>

        </div>

    </section>


    <!-- ===================================
         FINANCE APP
    ==================================== -->

    <main
        class="app"
        id="finance-app"
    >

        <!-- HEADER -->

        <header class="page-header">

            <div>

                <h1>My Finance</h1>

                <p
                    class="subtitle"
                    id="user-email"
                >
                    My personal finance management app.
                </p>

            </div>


            <button
                type="button"
                id="logout-button"
            >
                Logout
            </button>

        </header>


        <!-- BALANCE -->

        <section class="balance-card">

            <p>
                Total Balance
            </p>

            <h2 id="balance">
                RM 0.00
            </h2>

            <span>
                Current financial position
            </span>

        </section>


        <!-- SUMMARY -->

        <section class="summary-grid">

            <article class="summary-card">

                <p>Income</p>

                <h3 id="income">
                    RM 0.00
                </h3>

            </article>


            <article class="summary-card">

                <p>Expenses</p>

                <h3 id="expenses">
                    RM 0.00
                </h3>

            </article>

        </section>


        <!-- ===================================
             ACCOUNTS
        ==================================== -->

        <section class="accounts-section">

            <div class="section-heading">

                <h2>
                    My Accounts
                </h2>

            </div>


            <div
                id="account-list"
                class="account-list"
            ></div>


            <form
                id="account-form"
                class="account-form"
            >

                <h2 id="account-form-title">
                    Add Account
                </h2>


                <label for="account-name">
                    Account Name
                </label>

                <input
                    type="text"
                    id="account-name"
                    placeholder="e.g. Maybank"
                    required
                >


                <label for="account-type">
                    Account Type
                </label>

                <select
                    id="account-type"
                    required
                >

                    <option value="bank">
                        Bank
                    </option>

                    <option value="cash">
                        Cash
                    </option>

                    <option value="e_wallet">
                        E-Wallet
                    </option>

                    <option value="savings">
                        Savings
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <label for="opening-balance">
                    Opening Balance
                </label>

                <input
                    type="number"
                    id="opening-balance"
                    value="0"
                    step="0.01"
                    required
                >


                <button
                    type="submit"
                    id="save-account-button"
                >
                    + Add Account
                </button>


                <button
                    type="button"
                    id="cancel-account-edit-button"
                >
                    Cancel Edit
                </button>


                <p
                    id="account-message"
                    class="account-message"
                ></p>

            </form>

        </section>


        <!-- ===================================
             TRANSACTIONS
        ==================================== -->

        <section class="transactions-section">

            <div class="section-heading">

                <h2>
                    Recent Transactions
                </h2>


                <button
                    type="button"
                    class="view-all-button"
                >
                    View All
                </button>

            </div>


            <div id="transaction-list"></div>


            <form
                id="transaction-form"
                class="transaction-form"
            >

                <h2 id="form-title">
                    Add Transaction
                </h2>


                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Petrol"
                    required
                >


                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Transportation"
                    required
                >


                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    required
                >


                <label for="date">
                    Transaction Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="type">
                    Type
                </label>

                <select
                    id="type"
                    required
                >

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>


                <button
                    type="submit"
                    id="submit-button"
                >
                    + Add Transaction
                </button>


                <button
                    type="button"
                    id="cancel-edit-button"
                >
                    Cancel Edit
                </button>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="/script.js"
    ></script>

</body>

</html>
