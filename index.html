<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Finance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="page-header">

            <div>
                <h1>My Finance</h1>

                <p class="subtitle">
                    My personal finance management app.
                </p>
            </div>

        </header>


        <section class="balance-card">

            <p>Total Balance</p>

            <h2 id="balance">
                RM 0.00
            </h2>

            <span>
                Current financial position
            </span>

        </section>


        <section class="summary-grid">

            <article class="summary-card">

                <p>Income</p>

                <h3 id="income">
                    RM 0.00
                </h3>

            </article>


            <article class="summary-card">

                <p>Expenses</p>

                <h3 id="expenses">
                    RM 0.00
                </h3>

            </article>

        </section>


        <section class="transactions-section">

            <div class="section-heading">

                <h2>
                    Recent Transactions
                </h2>

                <button
                    type="button"
                    class="view-all-button"
                >
                    View All
                </button>

            </div>


            <div id="transaction-list"></div>


            <form
                id="transaction-form"
                class="transaction-form"
            >

                <h2 id="form-title">
                    Add Transaction
                </h2>


                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Petrol"
                    required
                >


                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="e.g. Transportation"
                    required
                >


                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    required
                >


                <label for="date">
                    Transaction Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="type">
                    Type
                </label>

                <select
                    id="type"
                    required
                >

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>


                <button
                    type="submit"
                    id="submit-button"
                >
                    + Add Transaction
                </button>


                <button
                    type="button"
                    id="cancel-edit-button"
                >
                    Cancel Edit
                </button>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
